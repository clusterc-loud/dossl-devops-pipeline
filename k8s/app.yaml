apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-task-manager
  namespace: devops-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-task-manager
  template:
    metadata:
      labels:
        app: student-task-manager
    spec:
      containers:
        - name: student-task-manager
          image: student-task-manager:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: TASK_DB
              value: /tmp/tasks.db
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: student-task-manager
  namespace: devops-demo
spec:
  selector:
    app: student-task-manager
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
